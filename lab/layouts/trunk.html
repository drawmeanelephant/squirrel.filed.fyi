<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{asset-url assets/css/lab.css}}">
  <link rel="stylesheet" href="{{asset-url assets/css/modes.css}}">
  <link rel="icon" type="image/svg+xml" href="{{asset-url assets/favicon.svg}}">
  {{head}}
  <link rel="alternate" type="application/rss+xml" title="squirrel.filed.fyi" href="https://squirrel.filed.fyi/rss.xml">
</head>
<body>
<header class="site-header">
  <div class="masthead">
    <p class="site-title"><svg class="site-mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="squirrel-pride" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5757"/><stop offset=".2" stop-color="#ff9edb"/><stop offset=".4" stop-color="#ffb84d"/><stop offset=".6" stop-color="#ffe873"/><stop offset=".8" stop-color="#63e6a5"/><stop offset="1" stop-color="#b28bff"/></linearGradient></defs><path class="fur tail" d="M 36 50 C 24 54 14 48 13 38 C 12 27 21 19 30 22 C 36 24 37 31 31 32 C 28 32.5 27 29 29 27.5" fill="none" stroke-width="5.5" stroke-linecap="round"/><path class="fur body" d="M 38 28 C 37 21 41 15 47 14 L 50 5 L 54 13 C 59 15 61 20 58 24 C 56 26.5 52 27.5 48 27 C 44 27.5 40 28.5 38 28 Z M 41 26 C 36 34 35 44 38 51 C 40 54 46 54 48 51 C 50 44 49 35 45 27.5 C 44 26.5 42.5 25.5 41 26 Z"/><circle class="eye" cx="52" cy="19" r="1.7"/></svg>squirrel<span class="x">.</span>filed.fyi</p>
    <div class="masthead-controls">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cycle color theme">☾ dark</button>
      <div class="search" id="search-root">
        <input type="search" id="search-input" placeholder="Search the graph  ( / )"
               autocomplete="off" spellcheck="false" aria-label="Search pages">
        <div class="search-results" id="search-results" hidden></div>
      </div>
    </div>
  </div>
</header>
<main class="site-body">
  <div class="site-breadcrumb">{{breadcrumb}}</div>
  <div class="site-cols">
    <aside class="site-rail">
      <nav class="treewrap">{{nav}}</nav>
      <aside class="site-toc">{{toc}}</aside>
    </aside>
    <article class="site-content">
      {{content}}
      <section class="graph-panel">
        <div class="gp-block" id="gp-relations"><p class="gp-title">relations</p>{{relations}}</div>
        <div class="gp-block" id="gp-children"><p class="gp-title">children</p>{{children}}</div>
        <div class="gp-block" id="gp-backlinks"><p class="gp-title">backlinks</p>{{backlinks}}</div>
      </section>
    </article>
  </div>
</main>
<footer class="site-footer">
  <p>filed, not forgotten. <a href="https://squirrel.filed.fyi/rss.xml">RSS</a>. Built with boris.</p>
  {{footer}}
</footer>
<script src="{{asset-url assets/js/search.js}}" defer></script>
<script src="{{asset-url assets/js/theme.js}}" defer></script>
</body>
</html>
